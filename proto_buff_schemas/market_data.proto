syntax = "proto3";

package MarketDataDisseminationProtoBuff;

// Wire side mirrors the book's `enum class Side { BUY, SELL }`.
enum Side {
  BUY  = 0;
  SELL = 1;
}


message Order {
  string order_id   = 1;
  uint64 price      = 2;  // integer ticks
  uint64 quantity   = 3;
  Side   side       = 4;
  string instrument = 5;
}


enum Action {
  ADD     = 0;  
  REMOVE  = 1;  
  REPLACE = 2;  
}

message Incremental {
  uint64 seq    = 1;
  Action action = 2;
  Order  order  = 3;  // the order added / removed / replaced
}

// One instrument's full order-level book.
message InstrumentBook {
  string instrument   = 1;
  repeated Order bids = 2;  // descending price, FIFO within a price
  repeated Order asks = 3;  // ascending price, FIFO within a price
}

// Full state to seed a subscriber: one book per instrument.
message Snapshot {
  uint64 seq                    = 1;  // book state as of this sequence number
  repeated InstrumentBook books = 2;
}
